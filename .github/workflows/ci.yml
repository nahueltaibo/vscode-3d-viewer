name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build package
        run: |
          npm ci
          npm run package

      - name: Report release
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already released, so merging this PR won't publish. Bump the version to release."
          else
            echo "::notice::Merging this PR publishes v$version."
          fi
